<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baby Driver: The Silent Remix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: one centered screening-room column: screen, subtitle strip, transport, chapter cards */
  --bg:#08070f; --panel:#13111f; --line:#2a2640; --ink:#ece8f6; --dim:#8d87a8;
  --red:#d0202f; --blue:#2b4fc4; --sub:#fff4c2; --spk:#ff7a7a; --cue:#9db2ff;
  --f-display:"Press Start 2P", ui-monospace, monospace;
  --f-body:"VT323", ui-monospace, "Courier New", monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:20px;line-height:1.25}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:20px 40px;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
h1{font-family:var(--f-display);font-size:clamp(13px,3vw,22px);margin:0;line-height:1.5;color:var(--red);text-shadow:3px 3px 0 var(--blue);text-wrap:balance}
header p{margin:0;color:var(--dim)}
.screen{position:relative;background:#000;border:2px solid var(--line);box-shadow:0 24px 70px #000c}
canvas{display:block;width:100%;max-width:100%;aspect-ratio:16/9;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
.subs{min-height:3.3em;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px 14px 10px;background:#000;color:var(--sub);font-size:clamp(19px,3.3vw,30px);line-height:1.1;text-wrap:balance}
.subs .spk{color:var(--spk)}
.subs .cue{color:var(--cue);font-style:italic}
.now{position:absolute;top:8px;left:10px;font-family:var(--f-display);font-size:clamp(7px,1.3vw,10px);color:#fff9;text-shadow:1px 1px 0 #000;pointer-events:none}
.start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#0007;border:0;color:var(--ink);font:inherit;cursor:pointer;width:100%}
.start b{font-family:var(--f-display);font-size:clamp(11px,2.4vw,18px);background:var(--red);padding:12px 18px;box-shadow:4px 4px 0 var(--blue)}
.start span{color:#fff;text-shadow:1px 1px 0 #000;font-size:22px}
.start:focus-visible b,button:focus-visible{outline:2px solid var(--sub);outline-offset:2px}
.screen:fullscreen{display:flex;flex-direction:column;justify-content:center;border:0}
.screen:fullscreen canvas{width:auto;height:calc(100vh - 4.2em);margin:0 auto}
.transport{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.transport button{font-family:var(--f-display);font-size:10px;color:var(--ink);background:var(--panel);border:2px solid var(--line);padding:9px 11px;cursor:pointer}
.transport button:hover{border-color:var(--red)}
.time{font-variant-numeric:tabular-nums;color:var(--dim);min-width:7.5em}
.track{position:relative;flex:1 1 260px;min-width:0;height:28px;display:flex;align-items:center}
.track input{width:100%;accent-color:var(--red);margin:0}
.ticks{position:absolute;inset:0;pointer-events:none}
.ticks i{position:absolute;top:2px;bottom:2px;width:2px;background:var(--blue)}
.chapters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.chapters button{text-align:left;font:inherit;color:var(--ink);background:var(--panel);border:2px solid var(--line);padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0}
.chapters button.on{border-color:var(--red);box-shadow:3px 3px 0 var(--blue)}
.chapters b{font-family:var(--f-display);font-size:10px;line-height:1.5}
.chapters small{color:var(--dim);font-size:18px}
.note{color:var(--dim);font-size:18px;margin:0}
@media (max-width:560px){.chapters{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>BABY DRIVER: THE SILENT REMIX</h1>
    <p>The whole movie, from memory. Cut to a 120 BPM beat you will never hear.</p>
  </header>

  <div class="screen" id="screen">
    <canvas id="cv" width="320" height="180" aria-label="Pixel art movie"></canvas>
    <div class="now" id="now"></div>
    <div class="subs" id="subs" aria-live="polite"></div>
    <button class="start" id="start" type="button"><b>&#9654; PRESS START</b><span id="runtime">Runtime 5:00 · cut to 120 BPM · soundtrack imagined</span></button>
  </div>

  <div class="transport">
    <button id="play" type="button">PLAY</button>
    <button id="prev" type="button" aria-label="Previous scene">&#9664;&#9664;</button>
    <button id="next" type="button" aria-label="Next scene">&#9654;&#9654;</button>
    <div class="track"><input id="scrub" type="range" min="0" max="300" step="0.1" value="0" aria-label="Seek"><div class="ticks" id="ticks"></div></div>
    <span class="time" id="time">00:00 / 05:00</span>
    <button id="fs" type="button">FULL</button>
  </div>

  <div class="chapters" id="chapters"></div>
  <p class="note" id="note">Space plays and pauses. Arrow keys skip 10 seconds. N and P jump scenes. F goes fullscreen.</p>
</div>

<script>
'use strict';
// ============================================================ engine
const W=320,H=180;
const cv=document.getElementById('cv'),c=cv.getContext('2d');
const SK='#f0c08e';
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const L=(a,b,p)=>a+(b-a)*clamp(p);
const seg=(p,a,b)=>clamp((p-a)/(b-a));
const ez=p=>{p=clamp(p);return p*p*(3-2*p)};
const rng=s=>()=>(s=(s*16807)%2147483647)/2147483647;
function hex(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]}
function mix(a,b,t){const A=hex(a),B=hex(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*clamp(t)).toString(16).padStart(2,'0')).join('')}
function R(x,y,w,h,col){c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function disc(cx,cy,r,col){r=Math.round(r);for(let y=-r;y<=r;y++){const w=Math.round(Math.sqrt(Math.max(0,r*r-y*y)));R(cx-w,cy+y,w*2+1,1,col)}}
function T(s,x,y,col='#fff',size=8,al='center',sh='#000'){c.font=size+'px "Press Start 2P", monospace';c.textAlign=al;c.textBaseline='middle';const o=Math.max(1,Math.round(size/8));if(sh){c.fillStyle=sh;c.fillText(s,x+o,y+o)}c.fillStyle=col;c.fillText(s,x,y)}
function ln(x1,y1,x2,y2,col='#eef2ff',w=1){c.strokeStyle=col;c.lineWidth=w;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke()}
function fade(a,col='#000'){a=clamp(a);if(a<=0)return;c.globalAlpha=a;R(0,0,W,H,col);c.globalAlpha=1}
function alpha(a,fn){c.globalAlpha=clamp(a);fn();c.globalAlpha=1}
function shake(k,t){c.translate(Math.round(Math.sin(t*90)*k),Math.round(Math.cos(t*70)*k))}

// ---------------------------------------------------------------- sky + city
const SKIES={day:['#4aa3e8','#cbeefe'],dusk:['#2a1b52','#f59a5a'],night:['#060a22','#28326a'],gray:['#59606e','#aeb3bd'],dawn:['#7a5aa0','#ffd7a0']};
const STARS=[];{const r=rng(3);for(let i=0;i<80;i++)STARS.push([r()*W|0,r()*110|0,r()])}
function sky(m,t=0){const[a,b]=SKIES[m];for(let i=0;i<12;i++)R(0,i*15,W,15,mix(a,b,i/11));if(m==='night')for(const s of STARS)R(s[0],s[1],1,1,(s[2]+t*.4)%1<.85?'#fff':'#5a63a0')}
function mkCity(seed,minH,maxH,minW,maxW){const r=rng(seed),b=[];let x=0;while(x<700){const w=(minW+r()*(maxW-minW))|0,h=(minH+r()*(maxH-minH))|0,wins=[];for(let wy=4;wy<h-3;wy+=5)for(let wx=2;wx<w-2;wx+=4)if(r()<.5)wins.push(wx,wy);b.push({x,w,h,wins,ant:r()<.22});x+=w+((r()*3)|0)}return{b,tw:x}}
const FAR=mkCity(7,40,105,10,24),NEAR=mkCity(41,25,75,16,32);
const CITYCOL={day:[['#93aac4',null],['#6a819c','#cde3f5']],dusk:[['#4b2f63','#ffb36b'],['#2b1c3d','#ffcf7a']],night:[['#161b3a','#9a8a4a'],['#0c1026','#ffd25a']],gray:[['#7c8290',null],['#5a606c','#c3c7cf']],dawn:[['#9a6a8a',null],['#5a3a5a','#ffd9a0']]};
function layer(Lr,base,sc,col,win,t){for(const b of Lr.b){let x=((b.x-sc)%Lr.tw+Lr.tw)%Lr.tw;if(x>W)x-=Lr.tw;if(x+b.w<0)continue;const top=base-b.h;R(x,top,b.w,b.h+40,col);if(b.ant){R(x+(b.w>>1),top-7,1,7,col);if((t*2+b.x)%2<1)R(x+(b.w>>1),top-8,1,1,'#ff3b3b')}if(win)for(let i=0;i<b.wins.length;i+=2)R(x+b.wins[i],top+b.wins[i+1],2,2,win)}}
function city(m,base=150,sc=0,t=0){const cc=CITYCOL[m];layer(FAR,base,sc*.35,cc[0][0],cc[0][1],t);layer(NEAR,base,sc,cc[1][0],cc[1][1],t)}
function cityBG(m,base=150,sc=0,t=0,moon){sky(m,t);if(moon)disc(moon[0],moon[1],10,m==='night'?'#f3eccc':'#fff4d0');city(m,base,sc,t)}
function street(base,sc=0){R(0,base,W,H-base,'#2c2c35');R(0,base,W,7,'#77727f');R(0,base+7,W,1,'#4a4652');for(let i=0;i<12;i++){const x=((i*40-sc*1.2)%480+480)%480-40;R(x,base+20,18,2,'#d9c85a')}}
function roof(base,col='#3d3644'){R(0,base,W,H-base,col);R(0,base,W,3,mix(col,'#ffffff',.2))}
function tower(x,base){R(x-7,base-12,1,12,'#2a2a2a');R(x+6,base-12,1,12,'#2a2a2a');R(x-9,base-28,18,16,'#7a5233');for(let i=0;i<4;i++)R(x-9,base-26+i*4,18,1,'#5a3a22');R(x-9,base-30,18,2,'#5a3a22');R(x-6,base-32,12,2,'#5a3a22');R(x-2,base-34,4,2,'#5a3a22')}
function wallFloor(wall,floor,fy=125){R(0,0,W,fy,wall);R(0,fy,W,H-fy,floor);R(0,fy-3,W,3,mix(wall,'#000000',.35))}
function win(x,y,w,h,m,t=0){R(x-3,y-3,w+6,h+6,'#2e2219');c.save();c.beginPath();c.rect(x,y,w,h);c.clip();sky(m,t);city(m,y+h+12,x*3,t);c.restore();R(x+w/2-1,y,2,h,'#2e2219')}
function rain(t,n=90,col='#8fa3c8'){for(let i=0;i<n;i++){const x=(i*37.3+t*20)%W,y=(i*53.7+t*260)%H;R(x,y,1,4,col)}}
function fire(x,y,w,t,hgt=24){for(let i=0;i<w;i+=2){const h=hgt*(.4+.6*Math.abs(Math.sin(t*9+i*1.7)));R(x+i,y-h,2,h,i%6<2?'#ff4a1a':'#ff8a1f');R(x+i,y-h*.5,2,h*.5,'#ffd23f')}}
function boom(x,y,r,t){const k=(t*20|0)%2;disc(x,y,r+k,'#ff4a1a');disc(x,y,r*.7,'#ff9a2e');disc(x,y,r*.38,'#fff3b0')}
function sparks(x,y,t,n=8,col='#ffe066'){const r=rng((t*12|0)+5);for(let i=0;i<n;i++)R(x+(r()-.5)*20,y+(r()-.5)*20,1,1,col)}
function heart(x,y,col='#ff4f7a'){R(x-3,y-2,2,2,col);R(x+1,y-2,2,2,col);R(x-3,y,6,1,col);R(x-2,y+1,4,1,col);R(x-1,y+2,2,1,col)}
function sfx(s,x,y,col='#ffe066',size=8){T(s,x,y,col,size,'center','#1a0a2a')}
function spiderbug(x,y){R(x-1,y,3,2,'#c8102e');R(x,y-1,1,1,'#1f3a9e');R(x-2,y,1,1,'#111');R(x+2,y,1,1,'#111');R(x-2,y+2,1,1,'#111');R(x+2,y+2,1,1,'#111')}
function pumpkin(x,y){R(x-1,y-1,3,3,'#ff8a1f');R(x,y-2,1,1,'#3a7a2a');R(x-1,y,1,1,'#7a3a00');R(x+1,y,1,1,'#7a3a00')}
function goo(x,y,t,s=1){for(let i=0;i<5;i++)disc(x+Math.sin(t*3+i*1.3)*4*s,y+Math.cos(t*2.3+i)*2*s,(3+i%2)*s,'#0b0b12');R(x-1,y-2*s,2,1,'#3d4a6a')}
function sandbits(x,y,t,n=20,spread=20,col='#c9a35c'){const r=rng(9);for(let i=0;i<n;i++){const a=r()*6.28+t*(1+r()),d=r()*spread;R(x+Math.cos(a)*d,y+Math.sin(a)*d*.6,1,1,i%3?col:'#a5823f')}}

// ---------------------------------------------------------------- vehicles & props
function bus(x,y){R(x,y-18,58,14,'#f6c21c');R(x+58,y-12,6,8,'#f6c21c');R(x,y-9,64,1,'#222');for(let i=0;i<7;i++){R(x+3+i*8,y-16,6,5,'#9fd3f0');if(i%2)R(x+4+i*8,y-14,3,3,SK)}disc(x+12,y-3,3,'#1a1a1a');disc(x+50,y-3,3,'#1a1a1a')}
function car(x,y,col='#7a2a2a',f=1){c.save();c.translate(Math.round(x),Math.round(y));c.scale(f,1);R(-15,-8,30,5,col);R(-8,-12,15,4,col);R(-6,-11,5,3,'#9fd3f0');R(1,-11,5,3,'#9fd3f0');R(13,-7,2,2,'#ffe58a');disc(-9,-2,2,'#111');disc(9,-2,2,'#111');c.restore()}
function glider(x,y,f=1,t=0,col='#3d434d'){c.save();c.translate(Math.round(x),Math.round(y));c.scale(f,1);R(-11,0,22,2,col);R(-14,-1,4,2,col);R(10,-1,4,2,col);R(-4,2,8,2,col);R(-12,1,1,1,'#ffd23f');R(11,1,1,1,'#ffd23f');const fl=(t*20|0)%2;R(-17-fl*2,0,4+fl*2,2,'#ff8a1f');R(-15,0,2,1,'#ffe066');c.restore()}
function board(x,y,f=1,t=0){c.save();c.translate(Math.round(x),Math.round(y));c.scale(f,1);R(-9,0,18,2,'#5a5f6a');R(-6,2,12,1,'#2a2a2e');const fl=(t*20|0)%2;R(-13-fl,0,4+fl,2,'#4ab3ff');c.restore()}
function tcar(x,y){R(x,y-22,60,20,'#b9bec7');R(x,y-9,60,2,'#c0392b');for(let i=0;i<5;i++)R(x+4+i*11,y-18,8,6,'#36506e');R(x+6,y-2,8,2,'#333');R(x+46,y-2,8,2,'#333')}
function crowd(base,n,seed,t,cheer=1,sc=1){const r=rng(seed),tops=['#c0392b','#2e86c1','#27ae60','#f39c12','#8e44ad','#d35400','#7f8c8d'],hair=['#2a1a10','#6a4a2a','#111','#c9a46a','#888'];for(let i=0;i<n;i++){const x=i*(W/n)+r()*6,b=Math.round(Math.sin(t*6*cheer+i)*cheer);R(x,base-9*sc+b,7*sc,10*sc,tops[i%7]);R(x+1*sc,base-14*sc+b,5*sc,5*sc,SK);R(x+1*sc,base-15*sc+b,5*sc,2*sc,hair[i%5])}}
function tentArm(x1,y1,x2,y2,t,wob=4){const n=14;let px=x1,py=y1;for(let i=0;i<=n;i++){const k=i/n,nx=-(y2-y1),ny=x2-x1,len=Math.hypot(nx,ny)||1,w=Math.sin(k*Math.PI)*Math.sin(t*3+k*4)*wob;px=L(x1,x2,k)+nx/len*w;py=L(y1,y2,k)+ny/len*w;R(px-1,py-1,3,3,i%2?'#7d828c':'#a3a8b2')}R(px-2,py-2,5,5,'#5d626b');R(px-1,py-1,2,2,'#ff3a3a')}
function tents(x,y,f,t,len=24,s=1){const sx=x-f*2*s,sy=y-14*s;const base=[-2.4,-.8,2.5,.7];for(let i=0;i<4;i++){let a=base[i];if(f<0)a=Math.PI-a;const ex=sx+Math.cos(a+Math.sin(t*2+i)*.3)*len*s,ey=sy+Math.sin(a+Math.sin(t*2+i)*.3)*len*s;tentArm(sx,sy,ex,ey,t+i,3*s)}}

// ---------------------------------------------------------------- characters
const CH={
