<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shrek: The Pixel Swamp Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: one centered screening column: screen, subtitle strip, transport, act cards */
  --bg:#0b0f0a; --panel:#141b12; --line:#2b3a26; --ink:#eef0e4; --dim:#93a088;
  --hood:#8ab03a; --leaf:#c8461d; --sub:#fff4c2; --spk:#ff8a7a; --cue:#a8d48a;
  --f-display:"Press Start 2P", ui-monospace, monospace;
  --f-body:"VT323", ui-monospace, "Courier New", monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:20px;line-height:1.25}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:20px 40px;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
h1{font-family:var(--f-display);font-size:clamp(13px,3vw,22px);margin:0;line-height:1.5;color:var(--hood);text-shadow:3px 3px 0 #2a3a1a;text-wrap:balance}
header p{margin:0;color:var(--dim)}
.screen{position:relative;background:#000;border:2px solid var(--line);box-shadow:0 24px 70px #000c}
canvas{display:block;width:100%;max-width:100%;aspect-ratio:16/9;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
.subs{min-height:3.3em;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px 14px 10px;background:#000;color:var(--sub);font-size:clamp(19px,3.3vw,30px);line-height:1.1;text-wrap:balance}
.subs .spk{color:var(--spk)}
.subs .cue{color:var(--cue);font-style:italic}
.now{position:absolute;top:8px;left:10px;font-family:var(--f-display);font-size:clamp(7px,1.3vw,10px);color:#fff9;text-shadow:1px 1px 0 #000;pointer-events:none}
.start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#0007;border:0;color:var(--ink);font:inherit;cursor:pointer;width:100%}
.start b{font-family:var(--f-display);font-size:clamp(11px,2.4vw,18px);background:var(--hood);padding:12px 18px;box-shadow:4px 4px 0 #2a1a10}
.start span{color:#fff;text-shadow:1px 1px 0 #000;font-size:22px}
.start:focus-visible b,button:focus-visible{outline:2px solid var(--sub);outline-offset:2px}
.screen:fullscreen{display:flex;flex-direction:column;justify-content:center;border:0}
.screen:fullscreen canvas{width:auto;height:calc(100vh - 4.2em);margin:0 auto}
.transport{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.transport button{font-family:var(--f-display);font-size:10px;color:var(--ink);background:var(--panel);border:2px solid var(--line);padding:9px 11px;cursor:pointer}
.transport button:hover{border-color:var(--hood)}
.time{font-variant-numeric:tabular-nums;color:var(--dim);min-width:7.5em}
.track{position:relative;flex:1 1 260px;min-width:0;height:28px;display:flex;align-items:center}
.track input{width:100%;accent-color:var(--hood);margin:0}
.ticks{position:absolute;inset:0;pointer-events:none}
.ticks i{position:absolute;top:2px;bottom:2px;width:2px;background:var(--leaf)}
.chapters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.chapters button{text-align:left;font:inherit;color:var(--ink);background:var(--panel);border:2px solid var(--line);padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0}
.chapters button.on{border-color:var(--hood);box-shadow:3px 3px 0 var(--leaf)}
.chapters b{font-family:var(--f-display);font-size:10px;line-height:1.5}
.chapters small{color:var(--dim);font-size:18px}
.note{color:var(--dim);font-size:18px;margin:0}
@media (max-width:560px){.chapters{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>SHREK: THE PIXEL SWAMP EDITION</h1>
    <p>The whole movie, from memory. Subtitles only. Ogres have layers.</p>
  </header>

  <div class="screen" id="screen">
    <canvas id="cv" width="320" height="180" aria-label="Pixel art movie"></canvas>
    <div class="now" id="now"></div>
    <div class="subs" id="subs" aria-live="polite"></div>
    <button class="start" id="start" type="button"><b>&#9654; PRESS START</b><span id="runtime">Runtime 6:00 · subtitles on · swamp included</span></button>
  </div>

  <div class="transport">
    <button id="play" type="button">PLAY</button>
    <button id="prev" type="button" aria-label="Previous scene">&#9664;&#9664;</button>
    <button id="next" type="button" aria-label="Next scene">&#9654;&#9654;</button>
    <div class="track"><input id="scrub" type="range" min="0" max="360" step="0.1" value="0" aria-label="Seek"><div class="ticks" id="ticks"></div></div>
    <span class="time" id="time">00:00 / 06:00</span>
    <button id="fs" type="button">FULL</button>
  </div>

  <div class="chapters" id="chapters"></div>
  <p class="note">Space plays and pauses. Arrow keys skip 10 seconds. N and P jump scenes. F goes fullscreen.</p>
</div>

<script>
'use strict';
// ============================================================ engine
const W=320,H=180;
const cv=document.getElementById('cv'),c=cv.getContext('2d');
const SK='#f0c08e';
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const L=(a,b,p)=>a+(b-a)*clamp(p);

function hex(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]}

function R(x,y,w,h,col){c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function disc(cx,cy,r,col){r=Math.round(r);for(let y=-r;y<=r;y++){const w=Math.round(Math.sqrt(Math.max(0,r*r-y*y)));R(cx-w,cy+y,w*2+1,1,col)}}
function T(s,x,y,col='#fff',size=8,al='center',sh='#000'){c.font=size+'px "Press Start 2P", monospace';c.textAlign=al;c.textBaseline='middle';const o=Math.max(1,Math.round(size/8));if(sh){c.fillStyle=sh;c.fillText(s,x+o,y+o)}c.fillStyle=col;c.fillText(s,x,y)}

function shake(k,t){c.translate(Math.round(Math.sin(t*90)*k),Math.round(Math.cos(t*70)*k))}
function sfx(s,x,y,col='#ffe066',size=8){T(s,x,y,col,size,'center','#1a0a0a')}
function heart(x,y,col='#ff4f7a'){R(x-3,y-2,2,2,col);R(x+1,y-2,2,2,col);R(x-3,y,6,1,col);R(x-2,y+1,4,1,col);R(x-1,y+2,2,1,col)}
function note(x,y,col='#fff'){R(x,y,1,6,col);R(x-2,y+5,3,2,col);R(x+1,y,3,1,col)}
function boom(x,y,r,t){const k=(t*20|0)%2;disc(x,y,r+k,'#ff4a1a');disc(x,y,r*.7,'#ff9a2e');disc(x,y,r*.38,'#fff3b0')}
function qmark(x,y,col='#fff'){T('?',x,y,col,10)}

// ---------------------------------------------------------------- scenery
const SKIES={day:['#5fb0e8','#d6f0ff'],dusk:['#3a2a5e','#f5a05a'],night:['#081020','#22345a'],snow:['#7ac0f0','#f0f8ff']};
const STARS=[];{const r=rng(3);for(let i=0;i<70;i++)STARS.push([r()*W|0,r()*100|0,r()])}
function sky(m,t=0){const[a,b]=SKIES[m];for(let i=0;i<12;i++)R(0,i*15,W,15,mix(a,b,i/11));if(m==='night')for(const s of STARS)R(s[0],s[1],1,1,(s[2]+t*.4)%1<.85?'#fff':'#5a63a0')}
function pine(x,base,h,col){const tw=Math.max(2,h/10|0);R(x-tw/2,base-h*.25,tw,h*.25,'#4a2e1a');for(let i=0;i<5;i++){const w=h*.55*(1-i/5),y=base-h*.25-(i+1)*h*.15;R(x-w/2,y,w,h*.17,col)}}
const TREES=[];{const r=rng(11);for(let i=0;i<40;i++)TREES.push([i*18+r()*10,40+r()*50,r()])}
function forest(m='day',t=0,sc=0,base=140){sky(m,t);const far=m==='night'?'#0f2a1e':'#4f7f5a',near=m==='night'?'#0a1f14':'#2f6a3a';for(const[x,h]of TREES){const xx=((x-sc*.4)%720+720)%720-40;if(xx<W+20)pine(xx,base-6,h*.8,far)}for(const[x,h,k]of TREES){const xx=((x*1.7-sc)%720+720)%720-40;if(k>.4&&xx<W+20)pine(xx,base+4,h*1.3,near)}R(0,base,W,H-base,m==='night'?'#1a2e16':'#5a9a3a');R(0,base,W,2,m==='night'?'#2a4422':'#7ab84a');R(0,base+18,W,10,m==='night'?'#3a3020':'#b8945a')}
function cottageIn(t){R(0,0,W,125,'#8a5a32');for(let y=0;y<125;y+=8)R(0,y,W,1,'#6e4626');R(0,125,W,55,'#5a3a20');for(let x=0;x<W;x+=24)R(x,125,1,55,'#4a2e18');R(30,26,60,46,'#2e2219');c.save();c.beginPath();c.rect(33,29,54,40);c.clip();forest('day',t,0,80);c.restore();R(59,29,2,40,'#2e2219');R(200,104,100,24,'#e8dcc0');R(200,112,100,16,'#b03a4a');for(let i=0;i<5;i++)R(204+i*20,114,8,8,'#d8b84a');R(196,90,6,40,'#5a3a20');R(130,40,40,85,'#6a4224');R(160,82,4,4,'#d8b84a')}
function cottageOut(t,m='day'){forest(m,t,0,150);R(110,70,110,80,'#c9a36a');for(let y=70;y<150;y+=8)R(110,y,110,1,'#a8844a');for(let i=0;i<14;i++)R(100+i*4,70-i*3,130-i*8,3,'#7a3a2a');R(150,104,26,46,'#5a3a20');R(122,86,20,18,'#ffe8a0');R(188,86,20,18,'#ffe8a0');R(196,40,10,20,'#6a6a6a')}
function tape(y,t){for(let x=-20;x<W;x+=26){R(x+(t*4%26),y,20,5,'#f2d22a');T('X',x+(t*4%26)+10,y+3,'#111',4,'center',null)}}
function sirens(t){alpha(.14,()=>R(0,0,W,H,(t*4|0)%2?'#ff2a2a':'#2a6aff'))}
function mountain(t,sc=0){sky('snow',t);c.fillStyle='#c8d8e8';c.beginPath();c.moveTo(0,120);c.lineTo(80,40);c.lineTo(170,110);c.lineTo(250,30);c.lineTo(320,90);c.lineTo(320,180);c.lineTo(0,180);c.fill();c.fillStyle='#f4f8fc';c.beginPath();c.moveTo(-10,60);c.lineTo(330,170);c.lineTo(330,180);c.lineTo(-10,180);c.fill();for(let i=0;i<8;i++){const x=((i*60-sc)%400+400)%400-40;pine(x,70+x*.34+20,22,'#2f5a3a')}}
function board(t){R(0,0,W,H,'#3a3a44');R(20,14,280,120,'#b88a5a');for(let i=0;i<60;i++)R((i*53)%280+20,(i*29)%120+14,2,2,'#a07a4a');R(0,140,W,40,'#2a2a30')}
function meadow(t){sky('day',t);R(0,110,W,70,'#6ab84a');for(let i=0;i<40;i++)R((i*37)%W,112+(i*17)%60,2,2,['#ff6a8a','#ffe066','#ffffff'][i%3]);disc(250,170,60,'#7ac85a')}
function gorge(t){sky('dusk',t);R(0,100,90,80,'#5a4a3a');R(230,90,90,90,'#5a4a3a');for(let i=0;i<10;i++)R(90+i*14,150+(i%3)*8,14,30,'#2a2018');ln(0,40,W,70,'#222');}

// ---------------------------------------------------------------- the cast
const OG='#8ab03a',OGD='#5a7a1a';
const CH={
 shrek:{kind:'ogre',fur:OG,top:'#d8d0b0',vest:'#6a4a2a',legs:'#6a5a3a',shoe:'#3a2a1a',s:1.3},
 fiona:{kind:'fiona',top:'#3a8a4a',legs:'#3a8a4a',dress:'#3a8a4a',shoe:'#2a5a2a'},
 fionaO:{kind:'fiona',fur:OG,ogre:1,top:'#3a8a4a',legs:'#3a8a4a',dress:'#3a8a4a',shoe:'#2a5a2a',s:1.15},
 fionaW:{kind:'fiona',top:'#f4f0e8',legs:'#f4f0e8',dress:'#f4f0e8',shoe:'#ddd'},
 fionaWO:{kind:'fiona',fur:OG,ogre:1,top:'#f4f0e8',legs:'#f4f0e8',dress:'#f4f0e8',shoe:'#ddd',s:1.15},
 farq:{kind:'farq',top:'#a0202a',legs:'#2a2a3a',shoe:'#111',s:.8},
 gingy:{kind:'gingy',fur:'#b8763a',top:'#b8763a',legs:'#b8763a',shoe:'#b8763a',s:.55},
 pino:{kind:'pino',fur:'#d8a060',top:'#e8e0c0',legs:'#3a7a3a',shoe:'#5a3a1a',s:.8},
 knight:{kind:'knight',fur:'#9aa0aa',top:'#9aa0aa',legs:'#7a808a',shoe:'#5a606a'},
 robin:{kind:'robin',top:'#3a7a2a',legs:'#3a7a2a',shoe:'#5a3a1a'},
 merry:{kind:'human',hair:'#6a4a2a',top:'#5a6a2a',legs:'#4a3a2a'},
 villager:{kind:'human',hair:'#4a2a1a',top:'#8a6a4a',legs:'#4a4a3a'},
 villager2:{kind:'human',hair:'#c9a46a',top:'#6a7a9a',legs:'#3a3a3a'},
 oldlady:{kind:'granny',top:'#5a4a6a',legs:'#5a4a6a',dress:'#5a4a6a'},
 mouse:{kind:'mouse',fur:'#9a9aa2',top:'#9a9aa2',legs:'#9a9aa2',s:.45},
 wolf:{kind:'wolf',fur:'#8a8f99',top:'#f0e6f0',legs:'#4a4a52'},
 pig:{kind:'pig',fur:'#f0a8b0',top:'#f0a8b0',legs:'#f0a8b0',shoe:'#e08890',s:.6},
 priest:{kind:'human',hair:'#ddd',top:'#f4f0e8',legs:'#f4f0e8',dress:'#f4f0e8'},
};
function arm(kind,front,by,col,hand,sw=0){const x=front?4:-6;switch(kind){
 case'up':R(x,-22+by,2,6,col);R(x,-24+by,2,2,hand);break;
 case'out':if(front){R(4,-16+by,6,2,col);R(10,-16+by,2,2,hand)}else{R(-10,-16+by,6,2,col);R(-12,-16+by,2,2,hand)}break;
 case'face':R(2,-18+by,2,3,col);R(1,-20+by,2,2,hand);break;
 case'hip':R(x+(front?0:-1),-16+by,3,2,col);R(x+(front?2:-2),-14+by,2,3,col);break;
 default:R(x,-16+by+sw,2,6,col);R(x,-10+by+sw,2,2,hand)}}
function critter(x,y,ch,o={}){
 const s=(o.s||2)*(ch.s||1),f=o.f||1,pose=o.pose||'stand',ph=o.ph||0;
 c.save();c.translate(Math.round(x),Math.round(y));
 if(o.rot){c.translate(0,-12*s);c.rotate(o.rot);c.translate(0,12*s)}
 c.scale(f*s,s);
 const fur=ch.fur||SK,top=ch.top,legs=ch.legs,shoe=ch.shoe||'#222',hand=ch.fur||SK;
 let by=0;
 if(ch.kind==='wolf'){R(-8,-12,3,7,fur);R(-9,-6,2,2,'#d8dce4')}
 if(ch.kind==='mouse'){R(-9,-6,5,1,'#c89aa0')}
 if(pose==='sit'){by=3;R(-3,-5,8,3,legs);R(4,-5,2,5,legs);R(4,-1,3,1,shoe)}
 else if(pose==='jump'||pose==='kick'){R(-4,-8,2,5,legs);R(-5,-4,2,2,shoe);if(pose==='kick'){R(2,-9,7,2,legs);R(9,-9,2,2,shoe)}else{R(1,-8,2,4,legs);R(2,-5,3,2,shoe)}}
 else{const a=(pose==='walk'||pose==='run')?Math.round(Math.sin(ph)*(pose==='run'?3:2)):0;R(-3+a,-8,2,7,legs);R(-3+a,-1,3,1,shoe);R(1-a,-8,2,7,legs);R(1-a,-1,3,1,shoe)}
 const sw=(pose==='walk'||pose==='run')?Math.round(Math.sin(ph)*1.5):0;
 const ak={up:['up','up'],point:['d','out'],hold:['out','out'],face:['d','face'],torch:['d','up'],hip:['hip','hip'],kick:['out','out'],flex:['up','up']}[pose]||['d','d'];
 arm(ak[0],false,by,mix(ch.vest||top,'#000000',.3),mix(hand,'#000000',.3),-sw);

 if(ch.kind==='gingy'){R(-1,-14+by,2,1,'#e02a4a');R(-1,-12+by,2,1,'#2ad04a');R(-4,-9+by,8,1,'#fff')}
 if(ch.kind==='knight')R(-1,-15+by,2,6,'#c0303a');
 const hy=-23+by;
 switch(ch.kind){
  case'ogre':R(-4,hy,8,7,fur);R(-6,hy+1,2,1,fur);R(-7,hy,1,3,fur);R(4,hy+1,2,1,fur);R(6,hy,1,3,fur);R(-2,hy+1,2,1,OGD);R(1,hy+1,2,1,OGD);R(-1,hy+2,1,1,'#222');R(2,hy+2,1,1,'#222');R(2,hy+3,2,2,mix(fur,'#000000',.15));R(-1,hy+5,5,1,o.grin?'#fff':'#4a3a1a');if(o.roar){R(-1,hy+4,5,3,'#4a1a1a');R(-1,hy+4,5,1,'#fff')}break;
  case'fiona':{const sk=ch.ogre?fur:SK;R(-3,hy,6,7,sk);if(ch.ogre){R(-5,hy+1,2,1,fur);R(3,hy+1,2,1,fur)}R(-3,hy-1,7,2,'#c8461d');R(-4,hy,2,3,'#c8461d');R(-5,hy+2,2,10,'#c8461d');R(-5,hy+11,2,2,'#e8a040');R(-1,hy-3,4,2,'#ffd23f');R(1,hy+3,1,1,'#222');R(-1,hy+3,1,1,'#222');R(0,hy+5,2,1,'#c0405a');break}
  case'farq':R(-5,hy-3,11,10,'#1a1a1a');R(-2,hy+1,6,5,SK);R(0,hy+2,1,1,'#222');R(2,hy+2,1,1,'#222');R(1,hy+4,2,1,'#a04040');R(-5,hy+5,3,4,'#1a1a1a');break;
  case'gingy':disc(0,hy+3,3.5,fur);R(-3,hy,6,1,'#fff');R(-1,hy+2,1,1,'#fff');R(2,hy+2,1,1,'#fff');R(-1,hy+5,4,1,'#fff');break;
  case'pino':R(-3,hy,6,7,fur);R(3,hy+3,3+(o.nose||0),1,fur);R(-3,hy-2,7,2,'#c03030');R(1,hy+2,1,1,'#222');R(-1,hy+2,1,1,'#222');break;
  case'knight':R(-3,hy-1,6,8,fur);R(-1,hy+3,5,1,'#222');R(-1,hy-3,2,2,'#c0303a');break;
  case'robin':R(-3,hy,6,7,SK);R(-3,hy-2,7,3,'#3a7a2a');R(3,hy-5,1,4,'#c03030');R(0,hy+5,3,1,'#6a3a1a');R(1,hy+3,1,1,'#222');break;
